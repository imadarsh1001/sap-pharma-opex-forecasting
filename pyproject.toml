[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-pharma-opex-forecasting"
version = "0.1.0"
description = "SAP Pharma OPEX Forecasting & Financial Intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
